# 테스트 시나리오
#
# `python bench/measure.py <서재폴더>` 가 이 파일을 읽어 매번 같은 질문을 던지고,
# 결과를 `bench/results/` 에 남긴다. **값이 바뀌면 그게 신호다.**
#
# 여기 적는 질문은 네가 실제로 Claude에게 물어볼 말이어야 한다. 지어낸 질문으로
# 재면 지어낸 숫자가 나온다. 서재를 바꾸면 이 파일도 바꿔라.
#
# expect 는 선택이다. 적어두면 회귀를 잡는다.
#   min_hits     이만큼은 나와야 한다
#   sources      결과에 이 경로(부분 일치)가 있어야 한다
#   hint         true = 재검색 힌트가 떠야 한다 (서재에 없는 말로 물었을 때)
#                false = 뜨면 안 된다 (잘 찾히는 말인데 잔소리하면 오탐)

shelf: bxm-guide

scenarios:
  # ── 잘 찾혀야 하는 것 ──────────────────────────────────
  - ask: 예외 처리 규약
    why: 서재의 핵심 주제. 이게 안 나오면 뭔가 크게 잘못된 것이다
    expect:
      min_hits: 3
      hint: false

  - ask: Service Bean DBIO 계층 구조
    why: 여러 낱말이 섞인 질문. 하나만 걸려도 결과는 나오지만 순위가 맞아야 한다
    expect:
      min_hits: 3
      hint: false

  - ask: omm 문법
    why: 이 서재만 쓰는 말. IDF가 높아 정확히 집혀야 한다
    expect:
      min_hits: 3
      hint: false

  - ask: NEFSS 전환 원칙
    why: 고유명사 + 일반명사 조합
    expect:
      min_hits: 2
      hint: false

  # ── 헛걸음이어야 하는 것 ────────────────────────────────
  - ask: 블록체인 합의 알고리즘
    why: 이 서재와 아무 상관 없다. BM25는 결과를 돌려주지만 힌트가 떠야 한다
    expect:
      hint: true

  - ask: 김치찌개 끓이는 법
    why: 위와 같다. 한 낱말도 안 겹칠 때
    expect:
      hint: true

  # ── 알려진 구멍 ───────────────────────────────────────
  # 고쳐야 할 것이 아니라 아직 못 고친 것이다. 실패로 세지 않되 매번 눈에 띄게 둔다.
  - ask: 로그인 인증 절차
    why: 이 서재에 로그인 이야기는 없다. 그런데 "인증"과 "절차"는 흔해서 결과가 나온다
    known_gap: |
      낱말 하나만 색인에 없으면(로그인) 힌트가 안 뜬다. 힌트는 내용어 절반 이상이
      없을 때만 뜨기 때문이다. 그래서 그럴듯한 오답이 조용히 나간다.
      규칙을 느슨하게 하면 오탐이 늘어난다는 것을 SPEC 12절에서 실측으로 확인했다.

  - ask: 에러 났을 때 어떻게 처리해
    why: |
      동의어 불일치를 재보려 했으나, 이 서재는 "예외"와 "에러"를 둘 다 쓴다
      (에러 27문서). 전제가 틀렸다. 잘 찾히는 것이 정상이다.
    expect:
      min_hits: 3
      hint: false
