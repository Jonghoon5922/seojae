# 테스트 시나리오
#
# bench/suggest.py 가 만든 뼈대다. **질문은 네가 고쳐라.**
# 책장 설명에서 뽑은 주제라 그럴듯해 보여도, 네가 실제로 물어볼 말은 아닐 수 있다.
#
# 서재: C:\Users\NB-24062008\Documents\서재

shelf: bxm-guide   # 가장 큰 책장. 다른 책장을 재려면 바꿔라

scenarios:

  # ── bxm-guide (576건) ──
  # 이 책장이 쓰는 말: 001, dbio, 조회, string, 전환, bxm, dto, java, bean, 컬럼, 00, 01, 액션, length, description
  # 질문은 이 어휘 안에서 써야 찾힌다.

  - ask: BXM 프레임워크 규약과 NEFSS→BXM 전환 가이드
    why: 책장 설명에 있는 주제. 지금 5건 찾힌다
    expect:
      min_hits: 3
      hint: false

  - ask: Service/Bean/DBIO 계층 구조
    why: 책장 설명에 있는 주제. 지금 5건 찾힌다
    expect:
      min_hits: 3
      hint: false

  - ask: omm 문법
    why: 책장 설명에 있는 주제. 지금 5건 찾힌다
    expect:
      min_hits: 3
      hint: false

  - ask: 예외 처리 규약
    why: 책장 설명에 있는 주제. 지금 5건 찾힌다
    expect:
      min_hits: 3
      hint: false

  # ── 예시책장 (1건) ──
  # 이 책장이 쓰는 말: 책장, 하나, 예시, 폴더, md, txt, pdf, docx, hwpx, xlsx, 색인
  # 질문은 이 어휘 안에서 써야 찾힌다.
  #
  # 설명이 아직 견본 그대로다. 첫 실행에 넣어둔 문구다.
  # 고치기 전에는 여기서 뽑을 주제가 없다.


  # ── 헛걸음이어야 하는 것 (대조군) ──

  - ask: 블록체인 합의 알고리즘
    why: 이 서재와 아무 상관 없는 주제
    expect:
      hint: true

  - ask: 김치찌개 끓이는 법
    why: 한 낱말도 안 겹칠 때
    expect:
      hint: true


  # ── 알려진 구멍 ──
  # 고쳐야 할 것이 아니라 아직 못 고친 것이다. 실패로 세지 않되 매번 눈에 띄게 둔다.

  - ask: 로그인 인증 절차
    why: 이 서재에 로그인 이야기는 없다. 그런데 '인증'과 '절차'는 흔해서 결과가 나온다
    known_gap: |
      낱말 하나만 색인에 없으면(로그인) 힌트가 안 뜬다. 힌트는 내용어 절반 이상이
      없을 때만 뜨기 때문이다. 그래서 그럴듯한 오답이 조용히 나간다.
      규칙을 느슨하게 하면 오탐이 는다는 것을 SPEC 12절에서 실측으로 확인했다.


  # ── 네 질문 ──
  # 실제로 Claude에게 물어볼 말을 여기 적어라. 위 어휘 목록을 보고 쓰면 잘 찾힌다.
  #
  # 더 좋은 방법이 있다. **Claude에게 몇 번 물어본 뒤** 이걸 다시 돌려라.
  #
  #   python bench/suggest.py "C:/Users/.../Documents/서재"
  #
  # 대출 기록에 쌓인 '실제로 물어본 말'을 끌어와 여기에 채워준다.
  # 지어낸 질문보다 그쪽이 낫다.
  #
  # - ask: 물어볼 말
  #   why: 왜 이걸 재는지. 나중의 내가 읽는다
  #   expect:
  #     min_hits: 3
  #     hint: false
  #     sources: [규정.md]

# 설명이 비어 있는 책장: 예시책장
# Claude에게 '○○ 책장 설명 써줘'라고 하면 채워준다.

