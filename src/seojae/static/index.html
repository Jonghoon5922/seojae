<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서재</title>
<style>
  :root {
    --bg: #faf9f7;
    --panel: #ffffff;
    --line: #e3e0da;
    --ink: #23201c;
    --dim: #7b756c;
    --accent: #7a5c3e;
    --accent-soft: #f2ebe2;
    --warn: #a8562a;
    --ok: #3f6f4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --panel: #232120;
      --line: #38352f;
      --ink: #e8e4dd;
      --dim: #9a938a;
      --accent: #c9a37a;
      --accent-soft: #2e2a25;
      --warn: #d78f5f;
      --ok: #7fae89;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header .meta { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  nav { display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--line);
        background: var(--panel); position: sticky; top: 53px; z-index: 9; }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 10px 14px; font: inherit; color: var(--dim); cursor: pointer;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  nav .badge {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    background: var(--accent); color: var(--panel); border-radius: 9px;
    font-size: 11px; line-height: 17px; text-align: center; vertical-align: 1px;
  }
  main { padding: 22px; max-width: 1180px; }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card + .card { margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }

  .shelf { display: block; width: 100%; text-align: left; background: none; border: none;
           font: inherit; color: inherit; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
  .shelf:hover { background: var(--accent-soft); }
  .shelf.on { background: var(--accent-soft); font-weight: 600; }
  .shelf .n { float: right; color: var(--dim); font-size: 12px; font-weight: 400; }
  .shelf .desc { display: block; font-size: 12px; color: var(--dim); font-weight: 400;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type=text], select, textarea {
    font: inherit; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink);
  }
  .searchbar input { flex: 1; }
  button.go, button.act {
    font: inherit; padding: 9px 15px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; border-radius: 8px; cursor: pointer;
  }
  button.ghost { background: none; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }

  .hit { padding: 14px 0; border-top: 1px solid var(--line); }
  .hit:first-child { border-top: none; }
  .src { font-size: 12px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .src .path { color: var(--accent); cursor: pointer; }
  .src .path:hover { text-decoration: underline; }
  .src .score { margin-left: auto; }
  .hit pre {
    margin: 8px 0 0; white-space: pre-wrap; word-break: break-word;
    font: inherit; background: var(--bg); padding: 10px 12px; border-radius: 8px;
  }
  mark { background: #f6e2b8; color: inherit; border-radius: 2px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { mark { background: #6a5326; } }

  .hint { background: var(--accent-soft); border-radius: 8px; padding: 11px 13px;
          font-size: 13px; margin-bottom: 12px; }
  .terms { font-size: 12px; color: var(--dim); margin-bottom: 12px; }
  .terms b { color: var(--ink); font-weight: 600; }
  .terms .zero { color: var(--warn); }

  .file { padding: 15px 0; border-top: 1px solid var(--line); }
  .file:first-child { border-top: none; }
  .file h3 { margin: 0 0 3px; font-size: 15px; }
  .file .excerpt { font-size: 13px; color: var(--dim); white-space: pre-wrap;
                   max-height: 6.4em; overflow: hidden; margin: 7px 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  td.done { color: var(--dim); }

  /* 드래그앤드롭 */
  .file[draggable] { cursor: grab; }
  .file.dragging { opacity: 0.45; }
  .shelf.drop, .dropzone.drop {
    background: var(--accent-soft);
    outline: 2px dashed var(--accent);
    outline-offset: -3px;
  }
  .dropzone {
    border: 2px dashed var(--line); border-radius: 10px;
    padding: 18px; text-align: center; color: var(--dim); font-size: 13px;
    transition: 0.12s;
  }
  .dropzone b { color: var(--ink); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea { width: 100%; }
  .field textarea { resize: vertical; line-height: 1.6; }
  .field small { display: block; color: var(--dim); font-size: 12px; margin-top: 5px; }

  .empty { color: var(--dim); padding: 26px 0; text-align: center; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg);
    padding: 11px 15px; border-radius: 9px; font-size: 14px; max-width: 460px;
    opacity: 0; transform: translateY(8px); transition: 0.18s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: none; }
  .toast.bad { background: var(--warn); color: #fff; }
  .doc h3 { margin: 0 0 2px; }
  .doc .row { align-items: flex-start; margin-bottom: 6px; }
  .doc .section { border-top: 1px solid var(--line); padding: 4px 0 10px; }
  .doc .loc-toggle {
    display: block; width: 100%; text-align: left; background: none; border: none;
    font: inherit; font-size: 13px; color: var(--accent); cursor: pointer;
    padding: 8px 4px; border-radius: 6px;
  }
  .doc .loc-toggle:hover { background: var(--accent-soft); }
  .doc .caret { display: inline-block; width: 14px; color: var(--dim); }
  .doc pre { margin: 2px 0 0 18px; white-space: pre-wrap; word-break: break-word; font: inherit; }
</style>
</head>
<body>

<header>
  <h1>서재 <span id="shelfName" class="meta"></span></h1>
  <span class="meta" id="headMeta"></span>
  <span class="spacer"></span>
  <button class="act ghost" id="reindexBtn">재색인</button>
</header>

<nav>
  <button data-tab="search" class="on">검색</button>
  <button data-tab="shelves">책장</button>
  <button data-tab="inbox">인박스<span class="badge" id="inboxBadge" hidden>0</span></button>
  <button data-tab="moves">기록</button>
  <button data-tab="settings">설정</button>
</nav>

<main>
  <!-- ── 검색 ─────────────────────────────────────────────── -->
  <section id="tab-search">
    <div class="layout">
      <aside>
        <div class="card">
          <h2>책장</h2>
          <div id="shelves"></div>
        </div>
        <div class="card" id="failedCard" hidden>
          <h2>읽지 못한 파일</h2>
          <div id="failedList" style="font-size:12px;color:var(--dim)"></div>
        </div>
      </aside>

      <div>
        <div class="searchbar">
          <input type="text" id="q" placeholder="Claude가 쓰는 것과 같은 검색입니다" autofocus>
          <button class="go" id="searchBtn">검색</button>
        </div>
        <div class="card">
          <div id="searchMeta"></div>
          <div id="results"><div class="empty">검색어를 입력하세요.</div></div>
        </div>
        <div class="card doc" id="docCard" hidden></div>
      </div>
    </div>
  </section>

  <!-- ── 책장 관리 ─────────────────────────────────────────── -->
  <section id="tab-shelves" hidden>
    <div class="layout">
      <aside>
        <div class="card">
          <div class="row" style="margin-bottom:10px">
            <h2 style="margin:0;flex:1">책장</h2>
            <button class="act ghost" id="newShelfBtn">+ 새 책장</button>
          </div>
          <div id="shelfList"></div>
        </div>
      </aside>
      <div id="shelfEditor">
        <div class="card"><div class="empty">왼쪽에서 책장을 고르세요.</div></div>
      </div>
    </div>
  </section>

  <!-- ── 인박스 ───────────────────────────────────────────── -->
  <section id="tab-inbox" hidden>
    <div class="layout">
      <aside>
        <div class="card">
          <h2>책장으로 끌어다 놓기</h2>
          <div id="inboxShelves"></div>
        </div>
      </aside>
      <div class="card">
        <h2>분류하지 않은 파일</h2>
        <div id="inboxList"></div>
      </div>
    </div>
  </section>

  <!-- ── 설정 ─────────────────────────────────────────────── -->
  <section id="tab-settings" hidden>
    <div class="card">
      <h2>서재 폴더</h2>
      <div class="field">
        <label>지금 열려 있는 서재</label>
        <input type="text" id="setRoot" spellcheck="false">
        <small id="setRootHelp"></small>
      </div>
      <div class="row">
        <label style="font-size:13px;color:var(--dim)">
          <input type="checkbox" id="setCreate" style="width:auto;vertical-align:-2px"> 폴더가 없으면 만들기
        </label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="act" id="setRootSave">서재 폴더 바꾸기</button>
      </div>
    </div>

    <div class="card">
      <h2>읽을 수 있는 형식</h2>
      <div id="setFormats"></div>
    </div>

    <div class="card">
      <h2>이 앱에 대하여</h2>
      <table id="setAbout"></table>
    </div>
  </section>

  <!-- ── 기록 ─────────────────────────────────────────────── -->
  <section id="tab-moves" hidden>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">파일을 옮긴 기록</h2>
        <span class="spacer" style="flex:1"></span>
        <button class="act ghost" id="undoBtn">마지막 작업 되돌리기</button>
      </div>
      <div id="movesList"></div>
    </div>

    <!-- 대출 기록. 위와 달리 사람이 아니라 Claude의 행적이다. -->
    <div class="card" style="margin-top:14px">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">꺼내 간 기록</h2>
        <span class="spacer" style="flex:1"></span>
        <label style="color:var(--dim);font-size:12px">
          <input type="checkbox" id="missedOnly"> 헛걸음만
        </label>
        <button class="act ghost" id="unreadBtn">안 꺼내진 문서</button>
      </div>
      <div id="readingSummary" class="hint" style="margin-bottom:10px"></div>
      <div id="readingsList"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = { collection: null, collections: [], lastQuery: "", terms: {} };

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || `요청 실패 (${res.status})`);
  return data;
}

let toastTimer;
function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3600);
}

// ── 상태 ────────────────────────────────────────────────────
async function loadStatus() {
  const s = await api("/api/status");
  state.collections = s.collections;
  $("#shelfName").textContent = s.name;
  $("#headMeta").textContent =
    `문서 ${s.document_count}건 · 마지막 색인 ${s.last_indexed_at ? s.last_indexed_at.slice(0, 16).replace("T", " ") : "없음"}`;

  const badge = $("#inboxBadge");
  badge.textContent = s.inbox_count;
  badge.hidden = s.inbox_count === 0;

  const box = $("#shelves");
  box.innerHTML = "";
  box.appendChild(shelfButton(null, "전체", s.document_count, ""));
  for (const c of s.collections) {
    box.appendChild(shelfButton(c.name, c.name, c.doc_count, c.description));
  }

  const failed = $("#failedCard");
  failed.hidden = s.failed.length === 0;
  if (s.failed.length) {
    $("#failedList").innerHTML = s.failed
      .map(f => `${esc(f.path)}<br><span style="opacity:.7">${esc(f.error.slice(0, 90))}</span>`)
      .join("<hr style='border:none;border-top:1px solid var(--line);margin:6px 0'>");
  }
}

function shelfButton(name, label, count, desc) {
  const b = el("button", "shelf" + (state.collection === name ? " on" : ""));
  b.innerHTML = `<span class="n">${count}</span>${esc(label)}` +
                (desc ? `<span class="desc">${esc(desc)}</span>` : "");
  b.onclick = () => {
    state.collection = name;
    document.querySelectorAll(".shelf").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    if (state.lastQuery) runSearch();
  };
  return b;
}

// ── 검색 ────────────────────────────────────────────────────
async function runSearch() {
  const q = $("#q").value.trim();
  if (!q) return;
  state.lastQuery = q;
  $("#docCard").hidden = true;

  const params = new URLSearchParams({ q, top_k: 10 });
  if (state.collection) params.set("collection", state.collection);

  let data;
  try {
    data = await api("/api/search?" + params);
  } catch (e) { toast(e.message, true); return; }

  state.terms = data.term_document_counts || {};
  renderSearchMeta(data);
  renderResults(data.results);
}

function renderSearchMeta(data) {
  const meta = $("#searchMeta");
  meta.innerHTML = "";

  if (data.hint) meta.appendChild(el("div", "hint", data.hint));

  const terms = Object.entries(data.term_document_counts || {});
  if (terms.length) {
    const d = el("div", "terms");
    d.innerHTML = "검색어별 문서 수 (전체 " + data.document_count + "건): " +
      terms.map(([t, n]) =>
        `<b class="${n === 0 ? "zero" : ""}">${esc(t)}</b> ${n}`).join(" · ");
    meta.appendChild(d);
  }
}

function highlight(text) {
  // 검색에 쓰인 토큰을 그대로 강조한다. 형태소라 어간만 걸리는 것이 정상이다.
  const tokens = Object.keys(state.terms).filter(t => state.terms[t] > 0 && t.length > 1);
  let out = esc(text);
  for (const t of tokens) {
    out = out.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"),
                      m => `<mark>${m}</mark>`);
  }
  return out;
}

function renderResults(results) {
  const box = $("#results");
  box.innerHTML = "";
  if (!results.length) {
    box.appendChild(el("div", "empty", "결과가 없습니다."));
    return;
  }
  for (const r of results) {
    const hit = el("div", "hit");
    const src = el("div", "src");

    const path = el("span", "path", r.source + " · " + r.location);
    path.onclick = () => openDocument(r.document_id, r.location);
    src.appendChild(path);
    src.appendChild(el("span", "score", "score " + r.score));
    hit.appendChild(src);

    const pre = el("pre");
    pre.innerHTML = highlight(r.text);
    hit.appendChild(pre);

    if (r.also_in && r.also_in.length) {
      hit.appendChild(el("div", "src", `↳ 같은 내용이 ${r.also_in.length}개 문서에 더 있음: ${r.also_in.slice(0, 2).join(", ")}`));
    }
    box.appendChild(hit);
  }
}

// 문서 전체를 한 번에 펼치지 않는다. 설계서 한 건이 청크 19개(5,000px)를 넘기도 하고
// PDF는 그보다 훨씬 크다. 찾던 대목을 열어두고 나머지는 목차처럼 접어둔다.
const EXPAND_ALL_UNDER = 4;

async function openDocument(id, section) {
  let doc;
  try { doc = await api(`/api/document/${id}`); }
  catch (e) { toast(e.message, true); return; }

  const card = $("#docCard");
  card.hidden = false;
  card.innerHTML = "";

  const head = el("div", "row");
  const titles = el("div");
  titles.appendChild(el("h3", null, doc.title));
  titles.appendChild(el("div", "src", `${doc.path} · 청크 ${doc.sections.length}개`));
  head.appendChild(titles);
  head.appendChild(el("span", "spacer")).style.flex = "1";

  const close = el("button", "act ghost", "닫기");
  close.onclick = () => { card.hidden = true; };
  head.appendChild(close);
  card.appendChild(head);

  const expandAll = doc.sections.length <= EXPAND_ALL_UNDER;
  let target = null;

  doc.sections.forEach((s, i) => {
    const sec = el("div", "section");
    const open = expandAll || s.location === section;
    if (s.location === section) {
      sec.style.background = "var(--accent-soft)";
      if (!target) target = sec;
    }

    const loc = el("button", "loc-toggle");
    loc.innerHTML = `<span class="caret">${open ? "▾" : "▸"}</span> ${esc(s.location || "(제목 없음)")}`;
    const pre = el("pre");
    pre.innerHTML = highlight(s.text);
    pre.hidden = !open;

    loc.onclick = () => {
      pre.hidden = !pre.hidden;
      loc.querySelector(".caret").textContent = pre.hidden ? "▸" : "▾";
    };

    sec.appendChild(loc);
    sec.appendChild(pre);
    card.appendChild(sec);
  });

  (target || card).scrollIntoView({ behavior: "smooth", block: "start" });
}

// ── 인박스 ──────────────────────────────────────────────────
async function loadInbox() {
  const box = $("#inboxList");
  box.innerHTML = "<div class='empty'>불러오는 중…</div>";

  let data;
  try { data = await api("/api/inbox"); }
  catch (e) { box.innerHTML = ""; toast(e.message, true); return; }

  // 왼쪽 책장 목록 — 여기로 카드를 끌어다 놓으면 이동한다
  const shelfBox = $("#inboxShelves");
  shelfBox.innerHTML = "";
  if (!data.collections.length) {
    shelfBox.appendChild(el("div", "empty", "책장이 없습니다."));
  }
  for (const name of data.collections) {
    const b = el("button", "shelf");
    b.textContent = name;
    b.onclick = () => {
      document.querySelector('nav button[data-tab="shelves"]').click();
      openShelfEditor(name);
    };
    makeDropTarget(b, name, async () => {
      await Promise.all([loadInbox(), loadStatus()]);
    });
    shelfBox.appendChild(b);
  }

  box.innerHTML = "";

  // 인박스에도 끌어다 놓을 수 있다 (분류는 나중에)
  const zone = el("div", "dropzone");
  zone.innerHTML = "파일을 여기에 끌어다 놓으면 <b>분류하지 않은 채로</b> 들어갑니다" +
    "<br><span style=\"font-size:12px\">나중에 Claude에게 “인박스 정리해줘”라고 하면 됩니다</span>";
  makeDropTarget(zone, "_inbox", async () => {
    await Promise.all([loadInbox(), loadStatus()]);
  });
  box.appendChild(zone);

  if (!data.files.length) {
    box.appendChild(el("div", "empty", "분류할 파일이 없습니다."));
    return;
  }

  for (const f of data.files) {
    const card = el("div", "file");
    makeDraggable(card, f.document_id);  // 책장으로 끌어다 놓을 수 있다
    card.appendChild(el("h3", null, f.filename));
    card.appendChild(el("div", "src", `${f.path} · ${f.size.toLocaleString()}바이트`));

    if (f.status !== "ok") {
      const err = el("div", "excerpt", "읽지 못한 파일: " + f.error);
      err.style.color = "var(--warn)";
      card.appendChild(err);
    } else {
      card.appendChild(el("div", "excerpt", f.excerpt));
    }

    const row = el("div", "row");
    const sel = el("select");
    sel.appendChild(el("option", null, "책장 선택…"));
    for (const c of data.collections) {
      const o = el("option", null, c);
      o.value = c;
      sel.appendChild(o);
    }

    const btn = el("button", "act", "옮기기");
    btn.onclick = async () => {
      if (!sel.value) { toast("책장을 고르세요.", true); return; }
      btn.disabled = true;
      try {
        const r = await api("/api/file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ document_id: f.document_id, collection: sel.value }),
        });
        toast(`${r.from} → ${r.to}${r.note ? " · " + r.note : ""}`);
        await Promise.all([loadInbox(), loadStatus()]);
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
      }
    };

    row.appendChild(sel);
    row.appendChild(btn);
    card.appendChild(row);
    box.appendChild(card);
  }
}

// ── 드래그앤드롭 ────────────────────────────────────────────
// 두 종류가 다르다.
//   앱 안에서 끌기 (인박스 → 책장) = 진짜 이동
//   밖에서 끌어오기 (탐색기 → 책장) = 가져오기(복사).
//     브라우저가 파일의 실제 경로를 주지 않아 원본을 지울 수 없다.

let draggingDocId = null;

function makeDraggable(node, documentId) {
  node.draggable = true;
  node.addEventListener("dragstart", (e) => {
    draggingDocId = documentId;
    node.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(documentId));
  });
  node.addEventListener("dragend", () => {
    draggingDocId = null;
    node.classList.remove("dragging");
  });
}

function hasFiles(e) {
  return Array.from(e.dataTransfer?.types || []).includes("Files");
}

/** 책장으로 쓸 드롭 대상. 앱 안 문서와 밖의 파일을 둘 다 받는다. */
function makeDropTarget(node, collectionName, after) {
  const on = (e) => {
    if (!hasFiles(e) && draggingDocId === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = hasFiles(e) ? "copy" : "move";
    node.classList.add("drop");
  };
  node.addEventListener("dragover", on);
  node.addEventListener("dragenter", on);
  node.addEventListener("dragleave", (e) => {
    if (!node.contains(e.relatedTarget)) node.classList.remove("drop");
  });

  node.addEventListener("drop", async (e) => {
    e.preventDefault();
    node.classList.remove("drop");

    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) {
      await importFiles(collectionName, files);
    } else if (draggingDocId !== null) {
      const id = draggingDocId;
      draggingDocId = null;
      try {
        const r = await api("/api/file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ document_id: id, collection: collectionName }),
        });
        toast(`${r.from} → ${r.to}${r.note ? " · " + r.note : ""}`);
      } catch (err) { toast(err.message, true); return; }
    } else {
      return;
    }
    if (after) await after();
  });
}

async function importFiles(collectionName, files) {
  const form = new FormData();
  form.append("collection", collectionName);
  for (const f of files) form.append("files", f, f.name);

  toast(`${files.length}개 파일 넣는 중…`);
  try {
    const r = await api("/api/import", { method: "POST", body: form });
    const ok = r.added.length;
    const bad = r.failed.length;
    toast(
      `${collectionName}에 ${ok}건 넣었습니다` +
      (bad ? ` · ${bad}건 실패: ${r.failed[0].error}` : "") +
      (ok ? " (원본은 그대로 남습니다)" : "")
    );
  } catch (e) { toast(e.message, true); }
}

// ── 책장 관리 ───────────────────────────────────────────────
let openShelf = null;

async function loadShelves() {
  const s = await api("/api/status");
  state.collections = s.collections;

  const box = $("#shelfList");
  box.innerHTML = "";
  if (!s.collections.length) {
    box.appendChild(el("div", "empty", "책장이 없습니다."));
  }
  for (const c of s.collections) {
    const b = el("button", "shelf" + (openShelf === c.name ? " on" : ""));
    b.innerHTML = `<span class="n">${c.doc_count}</span>${esc(c.name)}` +
      `<span class="desc">${esc(c.description)}</span>`;
    b.onclick = () => openShelfEditor(c.name);
    // 여기로 파일을 끌어다 놓을 수 있다
    makeDropTarget(b, c.name, async () => {
      await Promise.all([loadShelves(), loadStatus()]);
    });
    box.appendChild(b);
  }
  if (openShelf && s.collections.some(c => c.name === openShelf)) {
    await openShelfEditor(openShelf, true);
  }
}

async function openShelfEditor(name, keepScroll) {
  openShelf = name;
  document.querySelectorAll("#shelfList .shelf").forEach(x => x.classList.remove("on"));

  const info = state.collections.find(c => c.name === name) || {};
  let material = {};
  try { material = await api(`/api/collection/${encodeURIComponent(name)}/material`); }
  catch (e) { toast(e.message, true); }

  const box = $("#shelfEditor");
  box.innerHTML = "";

  // ── 이름·설명 편집 ──
  const card = el("div", "card");
  card.appendChild(el("h2", null, "책장 정보"));

  const nameRow = el("div", "field");
  nameRow.appendChild(el("label", null, "폴더 이름"));
  const nameIn = el("input");
  nameIn.type = "text";
  nameIn.value = name;
  nameRow.appendChild(nameIn);
  nameRow.appendChild(el("small", null, "바꾸면 폴더가 실제로 이름이 바뀝니다. 되돌릴 수 있습니다."));
  card.appendChild(nameRow);

  const titleRow = el("div", "field");
  titleRow.appendChild(el("label", null, "표시 이름 (name)"));
  const titleIn = el("input");
  titleIn.type = "text";
  titleIn.value = info.title || name;
  titleRow.appendChild(titleIn);
  card.appendChild(titleRow);

  const descRow = el("div", "field");
  descRow.appendChild(el("label", null, "설명 (description)"));
  const descIn = el("textarea");
  descIn.rows = 4;
  descIn.value = info.description || "";
  descRow.appendChild(descIn);
  descRow.appendChild(el("small", null,
    "“어떤 질문에 이 책장을 써야 하는지”를 적습니다. 이 문장이 Claude가 책장을 고르는 근거가 됩니다."));
  card.appendChild(descRow);

  const tagRow = el("div", "field");
  tagRow.appendChild(el("label", null, "태그 (쉼표로 구분)"));
  const tagIn = el("input");
  tagIn.type = "text";
  tagIn.value = (info.tags || []).join(", ");
  tagRow.appendChild(tagIn);
  card.appendChild(tagRow);

  const actions = el("div", "row");
  const save = el("button", "act", "저장");
  save.onclick = async () => {
    save.disabled = true;
    try {
      if (nameIn.value.trim() && nameIn.value.trim() !== name) {
        const r = await api(`/api/collection/${encodeURIComponent(name)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameIn.value.trim() }),
        });
        openShelf = r.renamed;
      }
      await api("/api/readme", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          collection: openShelf,
          name: titleIn.value.trim() || openShelf,
          description: descIn.value.trim(),
          tags: tagIn.value.split(",").map(t => t.trim()).filter(Boolean),
        }),
      });
      toast("저장했습니다. README.md에 반영됩니다.");
      await Promise.all([loadShelves(), loadStatus()]);
    } catch (e) { toast(e.message, true); }
    save.disabled = false;
  };
  actions.appendChild(save);

  const del = el("button", "act ghost", "빈 책장 삭제");
  del.onclick = async () => {
    try {
      await api(`/api/collection/${encodeURIComponent(openShelf)}`, { method: "DELETE" });
      toast(`'${openShelf}' 책장을 지웠습니다.`);
      openShelf = null;
      $("#shelfEditor").innerHTML = "";
      await Promise.all([loadShelves(), loadStatus()]);
    } catch (e) { toast(e.message, true); }
  };
  actions.appendChild(del);
  card.appendChild(actions);
  box.appendChild(card);

  // ── 설명을 쓸 재료 ──
  if (material.frequent_terms?.length) {
    const hint = el("div", "card");
    hint.appendChild(el("h2", null, "설명을 쓸 재료"));
    hint.appendChild(el("div", "terms",
      "자주 쓰는 용어: " + material.frequent_terms.slice(0, 20).join(", ")));
    hint.appendChild(el("div", "src",
      "Claude에게 맡기려면 대화창에서 “" + name + " 책장 설명 다시 써줘” 라고 하세요 " +
      "(describe_collection → write_collection_readme)."));
    box.appendChild(hint);
  }

  // ── 문서 목록 + 다른 책장으로 이동 ──
  let docs = [];
  try { docs = await api(`/api/documents?collection=${encodeURIComponent(name)}`); }
  catch (e) { /* 방금 이름을 바꿨을 수 있다 */ }

  const docCard = el("div", "card");
  docCard.appendChild(el("h2", null, `문서 ${docs.length}건`));

  // 이 책장으로 끌어다 놓는 자리
  const zone = el("div", "dropzone");
  zone.innerHTML = `파일을 여기에 끌어다 놓으면 <b>${esc(name)}</b> 책장에 들어갑니다` +
    `<br><span style="font-size:12px">탐색기에서 끌어오면 복사됩니다 (원본은 그대로). ` +
    `인박스에서 끌어오면 이동합니다.</span>`;
  makeDropTarget(zone, name, async () => {
    await Promise.all([loadShelves(), loadStatus()]);
  });
  docCard.appendChild(zone);

  if (!docs.length) {
    docCard.appendChild(el("div", "empty", "문서가 없습니다."));
  }
  for (const doc of docs.slice(0, 100)) {
    const row = el("div", "file");
    row.appendChild(el("h3", null, doc.title || doc.path));
    row.appendChild(el("div", "src", doc.path));

    const move = el("div", "row");
    const sel = el("select");
    sel.appendChild(el("option", null, "다른 책장으로…"));
    for (const c of state.collections) {
      if (c.name === openShelf) continue;
      const o = el("option", null, c.name);
      o.value = c.name;
      sel.appendChild(o);
    }
    const go = el("button", "act ghost", "이동");
    go.onclick = async () => {
      if (!sel.value) { toast("책장을 고르세요.", true); return; }
      go.disabled = true;
      try {
        const r = await api("/api/file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ document_id: doc.id, collection: sel.value }),
        });
        toast(`${r.from} → ${r.to}`);
        await Promise.all([loadShelves(), loadStatus()]);
      } catch (e) { toast(e.message, true); go.disabled = false; }
    };
    move.appendChild(sel);
    move.appendChild(go);
    row.appendChild(move);
    docCard.appendChild(row);
  }
  if (docs.length > 100) {
    docCard.appendChild(el("div", "src", `… 외 ${docs.length - 100}건`));
  }
  box.appendChild(docCard);

  if (!keepScroll) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("#newShelfBtn").onclick = async () => {
  const name = prompt("새 책장(폴더) 이름");
  if (!name || !name.trim()) return;
  try {
    const r = await api("/api/collection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() }),
    });
    toast(`'${r.created}' 책장을 만들었습니다.`);
    openShelf = r.created;
    await Promise.all([loadShelves(), loadStatus()]);
  } catch (e) { toast(e.message, true); }
};

// ── 기록 ────────────────────────────────────────────────────
async function loadMoves() {
  const box = $("#movesList");
  let rows;
  try { rows = await api("/api/moves"); }
  catch (e) { toast(e.message, true); return; }

  box.innerHTML = "";
  if (!rows.length) {
    box.appendChild(el("div", "empty", "아직 옮긴 파일이 없습니다."));
    return;
  }

  const t = el("table");
  t.innerHTML = "<tr><th>시각</th><th>종류</th><th>내용</th><th>되돌림</th></tr>";
  for (const r of rows) {
    const tr = el("tr");
    const detail = r.kind === "move" ? `${r.src} → ${r.dst}` : r.dst;
    tr.innerHTML =
      `<td>${esc(r.ts.slice(0, 19).replace("T", " "))}</td>` +
      `<td>${esc(r.kind)}</td>` +
      `<td>${esc(detail)}${r.note ? `<br><span style="color:var(--dim)">${esc(r.note)}</span>` : ""}</td>` +
      `<td class="done">${r.undone ? "되돌림" : ""}</td>`;
    t.appendChild(tr);
  }
  box.appendChild(t);
}

// ── 대출 기록 ───────────────────────────────────────────────
// 위쪽 "옮긴 기록"은 내가 한 일, 이쪽은 Claude가 한 일이다.
// "왜"는 검색어 그 자체다 — 이 앱은 LLM을 부르지 않으므로 의도를 물어볼 길이 없고,
// 어떤 말로 찾았는지가 의도에 가장 가깝다.
async function loadReadings() {
  const box = $("#readingsList");
  const only = $("#missedOnly").checked;
  let data;
  try { data = await api("/api/readings?only_empty=" + (only ? "true" : "false")); }
  catch (e) { toast(e.message, true); return; }

  const s = data.summary;
  $("#readingSummary").textContent = s.total
    ? `전체 ${s.total}회 · 헛걸음 ${s.empty}회 · ` +
      s.clients.map(c => `${c.name} ${c.count}회`).join(" · ")
    : "";

  box.innerHTML = "";
  if (!data.readings.length) {
    box.appendChild(el("div", "empty",
      only ? "헛걸음이 없습니다." : "아직 꺼내 간 기록이 없습니다."));
    return;
  }

  const t = el("table");
  t.innerHTML = "<tr><th>언제</th><th>누가</th><th>무엇을</th><th>왜</th><th>건</th></tr>";
  for (const r of data.readings) {
    const tr = el("tr");
    let why = esc(r.query || r.collection || "");
    if (r.note) why += ` <span style="color:var(--warn,#b26b00)">헛걸음</span>`;
    if (r.docs.length) {
      why += `<br><span style="color:var(--dim);font-size:12px">${esc(r.docs.join(", "))}</span>`;
    }
    tr.innerHTML =
      `<td>${esc(r.ts.slice(5, 19).replace("T", " "))}</td>` +
      `<td>${esc(r.client)}</td>` +
      `<td>${esc(r.tool)}</td>` +
      `<td>${why}</td>` +
      `<td>${r.hits}</td>`;
    t.appendChild(tr);
  }
  box.appendChild(t);
}

$("#missedOnly").addEventListener("change", loadReadings);

$("#unreadBtn").onclick = async () => {
  let never;
  try { never = await api("/api/readings/unread"); }
  catch (e) { toast(e.message, true); return; }
  const box = $("#readingsList");
  box.innerHTML = "";
  $("#readingSummary").textContent = never.length
    ? `한 번도 꺼내진 적 없는 문서 ${never.length}건`
    : "모든 문서가 한 번은 꺼내졌습니다.";
  const t = el("table");
  t.innerHTML = "<tr><th>문서</th></tr>";
  for (const path of never) {
    const tr = el("tr");
    tr.innerHTML = `<td>${esc(path)}</td>`;
    t.appendChild(tr);
  }
  if (never.length) box.appendChild(t);
};

// ── 설정 ────────────────────────────────────────────────────
async function loadSettings() {
  let s;
  try { s = await api("/api/settings"); }
  catch (e) { toast(e.message, true); return; }

  $("#setRoot").value = s.root;
  $("#setRoot").disabled = !s.can_change_root;
  $("#setRootSave").disabled = !s.can_change_root;
  $("#setRootHelp").textContent = s.can_change_root
    ? `이 폴더 바깥은 절대 읽지 않습니다. 바꾸면 앱을 껐다 켜야 적용됩니다. 분류 전 파일은 ${s.inbox_dirname}\\ 에 넣습니다.`
    : "브라우저로 열었을 때는 바꿀 수 없습니다. 앱으로 실행하면 여기서 바꿀 수 있습니다.";

  const formats = $("#setFormats");
  formats.innerHTML = "";
  const t = el("table");
  for (const f of s.formats) {
    const tr = el("tr");
    tr.innerHTML = `<td style="white-space:nowrap">${esc(f.label)}</td>` +
      `<td style="color:var(--dim)">${esc(f.extensions)}</td>`;
    t.appendChild(tr);
  }
  formats.appendChild(t);

  const about = $("#setAbout");
  about.innerHTML = "";
  for (const [k, v] of [
    ["버전", s.version],
    ["설정 파일", s.config_file],
    ["기록(로그)", s.log_file],
  ]) {
    if (!v) continue;
    const tr = el("tr");
    tr.innerHTML = `<td style="white-space:nowrap">${esc(k)}</td>` +
      `<td style="color:var(--dim);word-break:break-all">${esc(v)}</td>`;
    about.appendChild(tr);
  }
}

$("#setRootSave").onclick = async (e) => {
  const value = $("#setRoot").value.trim();
  if (!value) { toast("경로를 입력하세요.", true); return; }
  e.target.disabled = true;
  try {
    const r = await api("/api/settings/root", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ root: value, create: $("#setCreate").checked }),
    });
    toast(`${r.root}${r.created ? " (새로 만듦)" : ""} · ${r.note}`);
  } catch (err) { toast(err.message, true); }
  e.target.disabled = false;
};

// ── 탭 ──────────────────────────────────────────────────────
const loaders = {
  search: loadStatus,
  shelves: loadShelves,
  inbox: loadInbox,
  moves: () => { loadMoves(); loadReadings(); },
  settings: loadSettings,
};

document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    for (const name of Object.keys(loaders)) {
      $("#tab-" + name).hidden = name !== b.dataset.tab;
    }
    loaders[b.dataset.tab]();
  };
});

$("#searchBtn").onclick = runSearch;
$("#q").addEventListener("keydown", e => {
  // 한글은 조합 중에도 Enter가 온다 (마지막 글자를 확정하는 Enter).
  // 그대로 검색하면 확정 전 문자열로 검색된다.
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) runSearch();
});

$("#reindexBtn").onclick = async (e) => {
  e.target.disabled = true;
  e.target.textContent = "색인 중…";
  try {
    const s = await api("/api/reindex", { method: "POST" });
    toast(`색인 완료 — 새로 읽음 ${s.indexed} / 변경 없음 ${s.skipped} / 실패 ${s.failed}`);
    await loadStatus();
  } catch (err) { toast(err.message, true); }
  e.target.disabled = false;
  e.target.textContent = "재색인";
};

$("#undoBtn").onclick = async () => {
  try {
    const r = await api("/api/undo", { method: "POST" });
    toast(r.message);
    await Promise.all([loadMoves(), loadStatus()]);
  } catch (e) { toast(e.message, true); }
};

loadStatus().catch(e => toast(e.message, true));
