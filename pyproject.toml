[project]
name = "seojae-mcp"
dynamic = ["version"]
description = "폴더에 문서를 꽂아두면 Claude가 꺼내 읽는 로컬 RAG MCP 서버 (한국어 형태소 검색)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonghoon5922" }]
keywords = ["mcp", "rag", "korean", "search", "local", "claude", "bm25", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    # MCP 2.x에서 FastMCP가 MCPServer로 개명됐다. 1.x가 깔리면 import부터 실패한다.
    "mcp>=2.0",
    "kiwipiepy>=0.20",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "watchdog>=6.0",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # `seojae ui`가 직접 부른다. mcp를 통해 딸려오지만 우리 코드가 쓰므로 명시한다.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 데스크톱 앱 창. MCP 서버로만 쓸 때는 필요 없어서 기본에서 뺀다.
app = ["pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/Jonghoon5922/seojae"
Repository = "https://github.com/Jonghoon5922/seojae"
Issues = "https://github.com/Jonghoon5922/seojae/issues"

[project.scripts]
seojae = "seojae.cli:app"
# uvx는 패키지 이름과 같은 명령을 찾는다. 이 별칭이 있어야
# `uvx seojae-mcp serve <폴더>` 가 --from 없이 바로 된다.
seojae-mcp = "seojae.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

# 버전은 src/seojae/__init__.py 한 곳에만 있다. 여기서 읽으므로 어긋날 수 없다.
[tool.hatch.version]
path = "src/seojae/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seojae"]

[tool.hatch.build.targets.sdist]
include = ["src/seojae", "tests", "README.md", "SPEC.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
