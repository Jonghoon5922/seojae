[project]
name = "seojae-mcp"
version = "0.1.0"
description = "폴더에 문서를 꽂아두면 Claude가 꺼내 읽는 로컬 RAG MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "kiwipiepy>=0.20",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.2",
    "watchdog>=6.0.0",
    "fastapi>=0.141.1",
]

[project.scripts]
seojae = "seojae.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seojae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
